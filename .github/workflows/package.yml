name: package

# 推版本 tag（0.0.4 / v0.0.4）或手动指定 tag 时：构建三平台安装包并上传为 GitHub Release 资产。
# 刻意**不使用 Actions artifact**：安装包从构建机直接传到 Release，
# 不占 artifact 存储额度（GitHub Free 只有 500MB，三个安装包一轮就超）。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 0.0.4）。留空则只构建，不发布。"
        required: false
        type: string
  push:
    tags:
      - "0.*"
      - "v*"

# 默认只读；需要写 Release 的 job 单独提权
permissions:
  contents: read

# 同一 ref 的重复触发排队执行，避免两个发布流程抢同一 tag
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 先建一个草稿 Release：后面三个平台并发上传时它已经存在，不会打架；
  # 全部传完由 publish-release 解除草稿，失败时用户看不到半成品。
  prepare-release:
    name: Prepare release
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG 已存在，直接复用"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --generate-notes --title "$TAG"
            echo "已创建 draft release $TAG"
          fi

  # 测试先跑：任何触发都执行，失败就不进入三平台构建
  # JVM 测试在 Ubuntu（快、免费额度友好）；Compose 渲染测试在 macOS leg 里单独跑
  test:
    name: Tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || github.ref }}

      - name: Setup JDK 27
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "27"
          cache: gradle

      - name: Run tests (all modules except :app:test)
        run: ./gradlew test -x :app:test --console=plain --stacktrace
        shell: bash

  # 插件 JAR：只发布非内置插件（内置三个随 app 打包），并附 SHA256SUMS
  plugins:
    name: Plugin JARs
    needs: [prepare-release, test]
    if: >-
      always()
      && needs.prepare-release.result != 'failure'
      && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || github.ref }}

      - name: Setup JDK 27
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "27"
          cache: gradle

      - name: Build plugins
        run: ./gradlew packagePlugins verifyPluginVersions --console=plain --stacktrace
        shell: bash

      - name: Generate checksums
        shell: bash
        run: |
          # 同名插件出现多个版本说明 build/plugins 混进了旧 JAR，直接失败
          dupes=$(ls build/plugins/*.jar | sed -E 's#.*/##; s/-[0-9]+\.[0-9]+\.[0-9]+\.jar$//' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::同插件存在多个版本：$dupes"
            exit 1
          fi
          (cd build/plugins && shasum -a 256 *.jar > SHA256SUMS)

      - name: Upload plugin jars to release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          # 内置插件随 app 打包，不重复发布
          files=$(ls build/plugins/*.jar | grep -v -E 'dev\.mmcl\.(auth\.offline|theme\.sakura|ui\.about)-')
          gh release upload "$TAG" $files build/plugins/SHA256SUMS --clobber

  package:
    name: ${{ matrix.label }}
    needs: [prepare-release, test]
    # prepare-release 只在发版时运行；「不填 tag 的普通构建」不能被它连坐跳过
    if: >-
      always()
      && needs.prepare-release.result != 'failure'
      && needs.test.result == 'success'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # 上传 Release 资产需要
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (dmg)
            os: macos-15
            task: :app:packageDmg
            path: app/build/compose/binaries/main/dmg/*.dmg
          - label: Windows (msi)
            os: windows-latest
            task: :app:packageMsi
            path: app/build/compose/binaries/main/msi/*.msi
          - label: Linux (deb)
            os: ubuntu-latest
            task: :app:packageDeb
            path: app/build/compose/binaries/main/deb/*.deb
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 手动发布时构建 tag 指向的提交，而不是分支头；tag 不存在会直接失败
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || github.ref }}

      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: bash
        env:
          EXPECTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          tag="${EXPECTED_TAG#v}"
          if [ -z "$version" ]; then
            echo "::error::gradle.properties 里没有 version"
            exit 1
          fi
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $tag 与 gradle.properties 的 $version 不一致"
            exit 1
          fi
          echo "版本校验通过：$version"

      - name: Setup JDK 27
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "27"
          cache: gradle

      - name: Install deb tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      # Compose UI / 渲染测试依赖 macOS 图形环境，放在这条腿里跑
      - name: Run app tests
        if: runner.os == 'macOS'
        run: ./gradlew :app:test --console=plain --stacktrace
        shell: bash

      - name: Build installer
        run: ./gradlew ${{ matrix.task }} --console=plain --stacktrace
        shell: bash

      # 直接传到草稿 Release，不再经过 Actions artifact
      - name: Upload installer to release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" ${{ matrix.path }} --clobber -R "$GITHUB_REPOSITORY"

      # jpackage 的 stderr 只写进这个目录，失败时打到 Actions 日志里才有线索
      - name: Dump jpackage logs
        if: failure()
        shell: bash
        run: |
          for f in $(find app/build/compose/logs -name '*.txt' 2>/dev/null); do
            echo "===== $f"
            cat "$f"
          done || true

  publish-release:
    name: Publish release
    needs: [prepare-release, package, plugins]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download assets and compute SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          rm -rf dist && mkdir -p dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --dir dist --clobber
          # SHA256SUMS 是插件 job 自己生成的校验文件，不参与再哈希
          (cd dist && shasum -a 256 $(ls | grep -v '^SHA256SUMS$') > "$RUNNER_TEMP/hashes.txt")
          cat "$RUNNER_TEMP/hashes.txt"

      - name: Append hashes to release notes and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body > "$RUNNER_TEMP/body.md"
          {
            echo ""
            echo "### SHA-256"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/hashes.txt"
            echo '```'
          } >> "$RUNNER_TEMP/body.md"
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/body.md" --draft=false
          echo "已发布 release $TAG（正文含资产 SHA-256）"
