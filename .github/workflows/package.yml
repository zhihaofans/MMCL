name: package

# 手动触发，或推版本 tag（如 0.0.2 / v0.0.2）时出包
on:
  workflow_dispatch:
  push:
    tags:
      - "0.*"
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (dmg)
            os: macos-14
            task: :app:packageDmg
            artifact: MMCL-macos-dmg
            path: app/build/compose/binaries/main/dmg/*.dmg
          - label: Windows (msi)
            os: windows-latest
            task: :app:packageMsi
            artifact: MMCL-windows-msi
            path: app/build/compose/binaries/main/msi/*.msi
          - label: Linux (deb)
            os: ubuntu-latest
            task: :app:packageDeb
            artifact: MMCL-linux-deb
            path: app/build/compose/binaries/main/deb/*.deb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
          cache: gradle

      - name: Install deb tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build installer
        run: ./gradlew ${{ matrix.task }} --console=plain --stacktrace
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

      # jpackage 的 stderr 只写进这个目录，失败时打到 Actions 日志里才有线索
      - name: Dump jpackage logs
        if: failure()
        shell: bash
        run: |
          for f in $(find app/build/compose/logs -name '*.txt' 2>/dev/null); do
            echo "===== $f"
            cat "$f"
          done || true
